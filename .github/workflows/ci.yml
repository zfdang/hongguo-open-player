name: CI (Test & Verification)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  decoder:
    name: Build ByteVC2 decoder (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            make patch curl tar gzip diffutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-pkgconf
      - if: runner.os == 'macOS'
        run: bash scripts/build-bytevc2.sh
      - if: runner.os == 'Windows'
        shell: msys2 {0}
        run: bash scripts/build-bytevc2.sh

  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run offline regression tests
        run: npm run test:unit
