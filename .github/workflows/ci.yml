name: CI (Test & Verification)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  decoder:
    name: Build ByteVC2 decoder (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: mac-arm64
            output: arm64
          - os: macos-15-intel
            arch: mac-x64
            output: x64
          - os: windows-latest
            arch: win-x64
            output: x64
    steps:
      - uses: actions/checkout@v7

      - name: Restore ByteVC2 decoder cache
        id: cache-bytevc2
        uses: actions/cache@v6
        with:
          path: build/bytevc2/${{ matrix.output }}
          key: bytevc2-${{ matrix.arch }}-${{ hashFiles('scripts/build-bytevc2.sh', 'vendor/bytevc2/**') }}

      - if: runner.os == 'Windows' && steps.cache-bytevc2.outputs.cache-hit != 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          install: >-
            make patch curl tar gzip diffutils
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-pkgconf

      - if: runner.os == 'macOS' && steps.cache-bytevc2.outputs.cache-hit != 'true'
        run: bash scripts/build-bytevc2.sh

      - if: runner.os == 'Windows' && steps.cache-bytevc2.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build-bytevc2.sh

      - name: Verify decoder binary
        shell: bash
        run: |
          case "$(uname -m)" in arm64|aarch64) arch=arm64 ;; x86_64|amd64) arch=x64 ;; *) echo 'Unsupported arch' >&2; exit 1 ;; esac
          suffix=""
          [[ "$RUNNER_OS" == "Windows" ]] && suffix=".exe"
          chmod +x "build/bytevc2/$arch/ffmpeg$suffix"
          "./build/bytevc2/$arch/ffmpeg$suffix" -hide_banner -decoders | grep -q ' bvc2 '

  test:
    name: Test on ${{ matrix.os }} (Node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Cache Electron binaries
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/electron
            ~/Library/Caches/electron
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Run offline regression tests
        run: npm run test:unit
