name: Build & Release Native Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prep:
    name: Prepare Release Version
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      raw_version: ${{ steps.version.outputs.raw_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            RAW_VER="${GITHUB_REF#refs/tags/v}"
          else
            RAW_VER="1.0.${{ github.run_number }}"
          fi
          echo "tag=v${RAW_VER}" >> $GITHUB_OUTPUT
          echo "raw_version=${RAW_VER}" >> $GITHUB_OUTPUT
          echo "Computed release version: ${RAW_VER} (tag: v${RAW_VER})"

  build:
    name: Build Native Apps (${{ matrix.platform }})
    needs: prep
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            build_cmd: npm run build:mac
          - os: windows-latest
            platform: windows
            build_cmd: npm run build:win

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (22.x)
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Sync package version
        shell: bash
        run: |
          npm version "${{ needs.prep.outputs.raw_version }}" --no-git-tag-version --allow-same-version

      - name: Run offline regression tests
        run: npm run test:unit

      - name: Build platform packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ${{ matrix.build_cmd }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.platform }}
          path: |
            dist-electron/*.dmg
            dist-electron/*.exe
            dist-electron/*.zip
          if-no-files-found: error
          retention-days: 1

  release:
    name: Create or Update GitHub Release
    needs: [prep, build]
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: artifacts-*
          merge-multiple: true

      - name: Compute SHA256 Checksums
        shell: bash
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prep.outputs.tag }}
          name: "红果开源播放器 多平台原生桌面版 ${{ needs.prep.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ### 🎬 红果开源播放器 多平台原生桌面版 ${{ needs.prep.outputs.tag }}

            专为 macOS 与 Windows 平台打造的原生多端桌面应用，开箱即用，无需打开任何网页浏览器。

            #### ✨ 核心特性：
            - 🖥️ **macOS & Windows 原生双平台**：macOS (Apple Silicon & Intel) + Windows (x64) 全面覆盖；
            - 🍿 **全集免费秒播**：免手机登录，突破网页试看限制，整部 80~100+ 集无缝畅播；
            - ⚡ **MP4 CENC 实时流式解密**：原生级内存实时解密与 8 路并发 Range 下载加速，极速起播；
            - 🎬 **沉浸式竖屏影院**：专为短剧定制的 9:16 沉浸比例，键盘 ↑/↓ 秒切集数，空格暂停，左右快进；
            - 💾 **观影进度记忆**：自动记录各剧集播放进度，支持剧目收藏与分类检索。

            #### 📥 下载安装方式：
            - **Windows (x64)**：
              - 安装向导版：下载 `hongguo-open-player-*-win-x64-setup.exe`，双击根据向导安装，自动创建桌面与开始菜单快捷方式。
              - 单文件便携版：下载 `hongguo-open-player-*-win-x64-portable.exe`，双击直接运行。
              - 绿色免安装 ZIP：下载 `hongguo-open-player-*-win-x64.zip`，解压后双击 `红果开源播放器.exe` 直接运行。
            - **macOS (Apple Silicon M1/M2/M3/M4)**：
              - 安装镜像：下载 `hongguo-open-player-*-mac-arm64.dmg`，双击拖入 `Applications` 即可。
              - 免安装 ZIP：下载 `hongguo-open-player-*-mac-arm64.zip`，解压后直接运行。
            - **macOS (Intel x64)**：
              - 安装镜像：下载 `hongguo-open-player-*-mac-x64.dmg`，双击拖入 `Applications` 即可。
              - 免安装 ZIP：下载 `hongguo-open-player-*-mac-x64.zip`，解压后直接运行。
          files: |
            release-assets/*
